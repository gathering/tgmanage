! Command: show running-config
! device: oob1-stand (CCS-720XP-48Y6, EOS-4.33.2F)
!
! boot system flash:/EOS-4.33.2F.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 <removed>
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -taillogs
   no shutdown
!
ip dhcp snooping bridging
ip dhcp snooping information option
ip dhcp snooping information option circuit-id type none format %h:%p
ip dhcp snooping vlan 1
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname oob1-stand
ip name-server vrf default 1.1.1.1
dns domain tg26.tg.no
!
snmp-server ipv4 access-list mgmt_access
snmp-server contact TechNet
snmp-server community <removed> ro
!
spanning-tree mode mstp
!
