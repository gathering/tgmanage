!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 <removed>
username cvpadmin privilege 15 role network-admin secret sha512 <removed>
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-euwest-2.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=INET -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Loopback42
   no shutdown
!
ip dhcp relay information option
!
ip dhcp snooping
ip dhcp snooping information option
ip dhcp snooping information option circuit-id type none format %h:%p
ip dhcp snooping vlan 1-4094
!
vlan internal order ascending range 1006 1199
!
service routing protocols model multi-agent
!
queue-monitor length
queue-monitor length default thresholds 2048 1024
!
logging vrf MGMT host <removed taillight>
logging format rfc5424
!
logging level all 6
!
hostname d1-north
ip name-server vrf INET 185.110.148.226
ip name-server vrf INET 185.110.148.230
ip name-server vrf MGMT 185.110.148.226
ip name-server vrf MGMT 185.110.148.230
dns domain tg26.tg.no
!
sflow sample 16384
sflow polling-interval 10
sflow vrf INET destination influx.tg26.tg.no
sflow vrf INET source-interface Loopback42
sflow destination 127.0.0.1
sflow source-interface Loopback0
sflow run
!
snmp-server ipv4 access-list mgmt_access vrf MGMT
snmp-server ipv4 access-list mgmt_access vrf INET
snmp-server contact TechNet
snmp-server location FABRIC d1-north
snmp-server community <removed> ro
snmp-server vrf INET
snmp-server vrf MGMT
