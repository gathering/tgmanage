ethernet-switching-options {
    secure-access-port {
        vlan juniper-mgmt {
            dhcp-option82 {
                circuit-id {
                    prefix hostname;
                    use-vlan-id;
                }
            }
        }
    }
}

ethernet-switching-options {
    secure-access-port {
        vlan juniper-mgmt  {
            dhcp-option82 {
                circuit-id {
                    prefix hostname;
                    use-vlan-id;
                }
            }
        }
        interface edge-ports {
            no-dhcp-trusted;
        }
         vlan e1-noc {
            arp-inspection;
            examine-dhcp;
            examine-dhcpv6;
            inactive: neighbor-discovery-inspection;
            ip-source-guard;
            inactive: ipv6-source-guard;             dhcp-option82 {
                circuit-id {
                    use-vlan-id;
                }
            }
            no-option-37;
            /* inactive due to DHCP drops on MX platform */
            inactive: dhcpv6-option18 {
                use-option-82;
            }
        }
        ipv6-source-guard-sessions {
            max-number 128;
        }
    }
    port-error-disable {
        /* 30 minutes in seconds */
        disable-timeout 1800;
    }
    storm-control {
        action-shutdown;
        interface edge-ports {
            bandwidth 20000;
            multicast;
        }
    }
}
vlans {
    e1-noc {
        vlan-id 202;
    }
    juniper-mgmt {
        vlan-id 10;
        l3-interface vlan.10;
    }
}


