system {
    host-name e1-noc;
    auto-snapshot;
    domain-name tg26.tg.no;
    time-zone Europe/Oslo;
    /* tacacs primary, failbacks to local users */
    authentication-order tacplus;
    ports {
        console log-out-on-disconnect;
    }
    root-authentication {
        encrypted-password "<removed>";
    }
    name-server {
        185.110.148.226;
        185.110.148.231;
        2a06:5841:f:300::226;
        2a06:5841:f:300::231;
    }
    tacplus-server {
        2a02:d140:c012:1::73 {
            secret "<removed>";
        }
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "<removed>";
            }
        }
        user tech {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "<removed>";
            }
        }
    }
    services {
        ssh {
            root-login deny;
            protocol-version v2;
            client-alive-count-max 2;
            client-alive-interval 300;
            connection-limit 50;
            rate-limit 5;
        }
        netconf {
            ssh {
                port 830;
            }
        }
    }
    syslog {
        user * {
            any emergency;
        }
        host tg.taillight.lasse.cloud {
            any warning;
            authorization info;
            change-log any;
            interactive-commands any;
            allow-duplicates;
            explicit-priority;
	    structured-data;
        }
        /* Oxidized syslog */
        host 2a02:d140:c012:1::73 {
            interactive-commands notice;
            match UI_COMMIT_COMPLETED;
        }
        /* Local logging of syslog messages */
        file messages {
            any notice;
            authorization info;
            /* Fjerner mye graps i loggene */
            match "!(.*License.*|.*EX-BCM PIC.*|.*mojito_i2c_read.*|.*qsfp_tk_read_mem_page.*)";
        }
        /* Local logging of all user-commands typed in the CLI */
        file interactive-commands {
            interactive-commands any;
            match "UI_CMDLINE_READ_LINE|UI_COMMIT_COMPLETED";
        }
    }
    commit synchronize;
    ntp {
        server 129.240.2.6;
        server 129.240.2.42;
        server 2001:700:100:425::42;
        server 2001:700:100:2::6;
    }
}
chassis {
    redundancy {
        graceful-switchover;
    }
    aggregated-devices {
        ethernet {
            device-count 32;
        }
    }
    alarm {
        management-ethernet {
            link-down ignore;
        }
    }
}
snmp {
    contact "<removed>";
    location "TG!";
    community <removed> {
        authorization read-only;
        client-list-name mgmt;
    }
}
policy-options {
    prefix-list mgmt-v4 {
    }
    prefix-list mgmt-v6 {
    }
    /* Merged separate v4- og v6-lister */
    prefix-list mgmt {
        apply-path "policy-options prefix-list <mgmt-v*> <*>";
    }
}
firewall {
    family inet {
        filter mgmt-v4 {
            term accept-ssh {
                from {
                    source-prefix-list {
                        mgmt-v4;
                    }
                    destination-port 22;
                }
                then accept;
            }
            term discard-ssh {
                from {
                    destination-port 22;
                }
                then {
                    discard;
                }
            }
            term accept-all {
                then accept;
            }
        }
    }
    family inet6 {
        filter mgmt-v6 {
            term accept-ssh {
                from {
                    source-prefix-list {
                        mgmt-v6;
                    }
                    destination-port 22;
                }
                then accept;
            }
            term discard-ssh {
                from {
                    destination-port 22;
                }
                then discard;
            }
            term accept-all {
                then accept;
            }
        }
    }
}
protocols {
    igmp-snooping {
        vlan all {
            immediate-leave;
        }
    }
    mld-snooping {
        vlan all {
            immediate-leave;
        }
    }
}

protocols {
    rstp {
        bridge-priority 32k;
        interface edge-ports {
            edge;
            no-root-port;
        }

    }
    lldp {
        port-id-subtype interface-name;
        port-description-type interface-description;
        interface all;
    }
}


poe {
    interface all;
}

routing-options {
    rib inet.0 {
        static {
            route 0.0.0.0/0 next-hop 185.110.149.1;
        }
    }
    rib inet6.0 {
        static {
            route ::/0 next-hop 2a06:5841:f:0::1;
        }
    }
    nonstop-routing;
}




