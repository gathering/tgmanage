aaa_root:
  disabled: true
clock:
  timezone: CET
config_end: true
daemon_terminattr:
  cvaddrs:
    - apiserver.cv-prod-euwest-2.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvsourceintf: Loopback42
  cvvrf: INET
  disable_aaa: false
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: tg26.tg.no
enable_password:
  disabled: true
eos_cli: service unsupported-transceiver <removed>
ethernet_interfaces:
  - name: Ethernet53/1
    description: P2P_s1-noc_Ethernet6/1
    shutdown: false
    mtu: 9100
    ipv6_enable: true
    metadata:
      peer: s1-noc
      peer_interface: Ethernet6/1
      peer_type: spine
    sflow:
      enable: true
    switchport:
      enabled: false
  - name: Ethernet54/1
    description: P2P_s2-noc_Ethernet6/1
    shutdown: false
    mtu: 9100
    ipv6_enable: true
    metadata:
      peer: s2-noc
      peer_interface: Ethernet6/1
      peer_type: spine
    sflow:
      enable: true
    switchport:
      enabled: false
  - name: Ethernet49
    description: 'G: e1-creative_xe-0/1/0'
    shutdown: false
    channel_group:
      id: 10
      mode: active
    lacp_timer:
      mode: fast
    lacp_port_priority: 8192
    metadata:
      peer: 'G: e1-creative'
      peer_interface: xe-0/1/0
      peer_type: endpoint
      peer_key: endpoints
  - name: Ethernet50
    description: 'G: e1-creative_xe-0/1/1'
    shutdown: false
    channel_group:
      id: 10
      mode: active
    lacp_timer:
      mode: fast
    lacp_port_priority: 32768
    metadata:
      peer: 'G: e1-creative'
      peer_interface: xe-0/1/1
      peer_type: endpoint
      peer_key: endpoints
  - name: Po10
    description: 'B: e1-creative ae0'
    shutdown: false
    spanning_tree_portfast: edge
    metadata:
      peer_type: network_port
      peer_key: network_ports
    sflow:
      enable: true
    switchport:
      enabled: true
      mode: trunk
      trunk:
        allowed_vlan: 10,219,1337,1338,1339,1340,1341,300,301,667,3306
        native_vlan: 10
hostname: d2-tele
ip_dhcp_relay:
  information_option: true
ip_dhcp_snooping:
  enabled: true
  bridging: false
  information_option:
    enabled: true
    circuit_id_type: none
    circuit_id_format: '%h:%p'
  vlan: 1-4094
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
    - name: INET
      servers:
        - ip_address: 185.110.148.226
        - ip_address: 185.110.148.230
    - name: MGMT
      servers:
        - ip_address: 185.110.148.226
        - ip_address: 185.110.148.230
ip_routing_ipv6_interfaces: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
ipv6_prefix_lists:
  - name: PL-LOOPBACKS-EVPN-OVERLAY-V6
    sequence_numbers:
      - sequence: 10
        action: permit 2a06:5841:e::/64 eq 128
ipv6_static_routes:
  - vrf: MGMT
    prefix: ::/0
    next_hop: 2a06:5841:f:1::1
ipv6_unicast_routing: true
local_users:
  - name: admin
    privilege: 15
    role: network-admin
    sha512_password: <removed>
  - name: cvpadmin
    privilege: 15
    role: network-admin
    sha512_password: <removed>
logging:
  format:
    rfc5424: true
  vrfs:
    - name: MGMT
      hosts:
        - name: <removed taillight>
          protocol: udp
  level:
    - facility: all
      severity: '6'
loopback_interfaces:
  - name: Loopback0
    description: ROUTER_ID
    shutdown: false
    ip_address: 10.255.0.14/32
    ipv6_addresses:
      - 2a06:5841:e::e/128
  - name: Loopback1
    description: VXLAN_TUNNEL_SOURCE
    shutdown: false
    ip_address: 10.255.1.14/32
  - name: Loopback13
    description: DIAG_VRF_CLIENTS
    shutdown: false
    vrf: CLIENTS
    ip_address: 10.255.13.14/32
    ipv6_addresses:
      - 2a06:5841:e:104::e/128
  - name: Loopback11
    description: DIAG_VRF_INET
    shutdown: false
    vrf: INET
    ip_address: 10.255.11.14/32
    ipv6_addresses:
      - 2a06:5841:e:102::e/128
  - name: Loopback42
    description: in_band_MGMT-lo42
    shutdown: false
    vrf: INET
    ip_address: 185.110.148.44/32
    eos_cli: ipv6 address 2a06:5841:f:200::44/128
  - name: Loopback18
    description: DIAG_VRF_LARS-CEPH
    shutdown: false
    vrf: LARS-CEPH
    ip_address: 10.255.18.14/32
    ipv6_addresses:
      - 2a06:5841:e:109::e/128
management_interfaces:
  - name: Management1
    description: OOB_MANAGEMENT
    shutdown: false
    vrf: MGMT
    ip_address: 185.110.148.77/26
    ipv6_enable: true
    ipv6_addresses:
      - 2a06:5841:f:1::77/64
    type: oob
    gateway: 185.110.148.65
    ipv6_gateway: 2a06:5841:f:1::1
metadata:
  is_deployed: true
  platform: EOS
  fabric_name: FABRIC
  cv_tags:
    device_tags:
      - name: topology_hint_fabric
        value: FABRIC
      - name: topology_hint_type
        value: leaf
      - name: topology_hint_rack
        value: d2-tele
ntp:
  local_interface:
    name: Loopback42
    vrf: INET
  servers:
    - name: ntp.uio.no
      preferred: true
  vrf: INET
port_channel_interfaces:
  - name: Port-Channel10
    description: 'ENDPOINT_G: e1-creative_ae0'
    shutdown: false
    lacp_fallback_timeout: 30
    lacp_fallback_mode: static
    sflow:
      enable: true
    switchport:
      enabled: true
      mode: trunk
      trunk:
        allowed_vlan: 10,219,1337,1338,1339,1340,1341,300,301,667,3306
        native_vlan: 10
    eos_cli: ip dhcp snooping interface information option circuit-id type none value e1-creative
prefix_lists:
  - name: PL-LOOPBACKS-EVPN-OVERLAY
    sequence_numbers:
      - sequence: 10
        action: permit 10.255.0.0/27 eq 32
      - sequence: 20
        action: permit 10.255.1.0/27 eq 32
queue_monitor_length:
  enabled: true
  default_thresholds:
    high: 2048
    low: 1024
route_maps:
  - name: RM-CONN-2-BGP
    sequence_numbers:
      - sequence: 10
        type: permit
        match:
          - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
      - sequence: 30
        type: permit
        match:
          - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65015'
  router_id: 10.255.0.14
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      metadata:
        type: ipv4
      password: 7x4B4rnJhZB438m9+BrBfQ==
      send_community: all
      maximum_routes: 256000
    - name: EVPN-OVERLAY-PEERS
