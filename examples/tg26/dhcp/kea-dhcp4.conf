{
  "Dhcp4": {
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "/var/log/kea/dhcp4-debug.log",
            "maxver": 8,
            "maxsize": 204800,
            "flush": true,
            "pattern": "%d{%j %H:%M:%S.%q} %c %m\n"
          }
        ],
        "severity": "DEBUG",
        "debuglevel": 40
      }
    ],
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so",
        "parameters": {}
      },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so",
        "parameters": {}
      },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_subnet_cmds.so",
        "parameters": {}
      },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_flex_option.so",
        "parameters": {
          "options": [
            {
              "name": "vendor-encapsulated-options",
              "client-class": "fap-class",
              "sub-options": [
                {
                  "name": "config-file-name",
                  "space": "vendor-encapsulated-options-space",
                  "supersede": "ifelse(option[82].option[1].exists,concat('ztp/', option[82].option[1].hex),'')"
                }
              ]
            },
            {
              "name": "host-name",
              "client-class": "fap-class",
              "remove": "option[12].exists"
            }
          ]
        }
      }
    ],
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "::1"
    },
    "ddns-send-updates": true,
    "ddns-override-no-update": false,
    "ddns-override-client-update": false,
    "ddns-replace-client-name": "always",
    "ddns-generated-prefix": "dhcp",
    "ddns-update-on-renew": false,
    "ddns-use-conflict-resolution": true,
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ],
      "dhcp-socket-type": "udp"
    },
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/var/run/kea/dhcp4"
      },
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8084
      }
    ],
    "lease-database": {
      "type": "postgresql",
      "name": "kea",
      "user": "kea",
      "password": "<removed>"
    },
    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "unwarned-reclaim-cycles": 5
    },
    "authoritative": true,
    "renew-timer": 1800,
    "rebind-timer": 3150,
    "valid-lifetime": 3600,
    "option-def": [
      {
        "name": "image-file-name",
        "code": 0,
        "space": "vendor-encapsulated-options-space",
        "type": "string",
        "array": false
      },
      {
        "name": "config-file-name",
        "code": 1,
        "space": "vendor-encapsulated-options-space",
        "type": "string",
        "array": false
      },
      {
        "name": "image-file-type",
        "code": 2,
        "space": "vendor-encapsulated-options-space",
        "type": "string",
        "array": false
      },
      {
        "name": "transfer-mode",
        "code": 3,
        "space": "vendor-encapsulated-options-space",
        "type": "string",
        "array": false
      },
      {
        "code": 150,
        "name": "tftp-server-address",
        "space": "dhcp4",
        "type": "ipv4-address",
        "array": true
      }
    ],
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "185.110.148.226,185.110.148.230"
      },
      {
        "name": "domain-name",
        "data": "tg26.tg.no"
      },
      {
        "name": "domain-search",
        "data": "tg26.tg.no"
      }
    ],
    "client-classes": [
      {
        "name": "client-juniper-vendor",
        "test": "substring(option[vendor-class-identifier].hex,0,7) == 'Juniper'"
      },
      {
        "name": "client-juniper-mac",
        "test": "substring(pkt4.mac, 0, 2) == '0x44f477' or substring(pkt4.mac, 0, 2) == '0xf01c2d'"
      },
      {
        "name": "client-arista-vendor",
        "test": "substring(option[vendor-class-identifier].hex,0,7) == 'Arista'"
      },
      {
        "name": "fap-class",
        "test": "member('client-juniper-vendor') or member('client-juniper-mac')",
        "option-data": [
          {
            "name": "vendor-encapsulated-options",
            "always-send": true
          },
          {
            "name": "transfer-mode",
            "space": "vendor-encapsulated-options-space",
            "data": "http",
            "always-send": true
          },
          {
            "name": "tftp-server-address",
            "data": "185.110.148.236",
            "always-send": true
          }
        ]
      },
      {
        "name": "fap-class-arista",
        "test": "member('client-arista-vendor')",
        "option-data": [
          {
            "name": "vendor-encapsulated-options",
            "always-send": true
          },
          {
            "name": "transfer-mode",
            "space": "vendor-encapsulated-options-space",
            "data": "http",
            "always-send": true
          },
          {
            "name": "tftp-server-address",
            "data": "185.110.148.236",
            "always-send": true
          }
        ]
      },
      {
        "name": "Cisco-Phone",
        "test": "substring(option[60].hex,0,28) == 'Cisco Systems, Inc. IP Phone'",
        "option-data": [
          {
            "name": "tftp-server-address",
            "data": "185.80.182.106",
            "always-send": true
          }
        ]
      },
      {
        "name": "PXE-XClient_iPXE",
        "test": "substring(option[77].hex,0,4) == 'iPXE'",
        "boot-file-name": "https://185.110.148.227/menu.ipxe"
      },
      {
        "name": "PXE-UEFI-32-1",
        "test": "substring(option[60].hex,0,20) == 'PXEClient:Arch:00006'",
        "next-server": "185.110.148.227",
        "boot-file-name": "netboot.xyz.efi"
      },
      {
        "name": "PXE-UEFI-32-2",
        "test": "substring(option[60].hex,0,20) == 'PXEClient:Arch:00002'",
        "next-server": "185.110.148.227",
        "boot-file-name": "netboot.xyz.efi"
      },
      {
        "name": "PXE-UEFI-64-1",
        "test": "substring(option[60].hex,0,20) == 'PXEClient:Arch:00007'",
        "next-server": "185.110.148.227",
        "boot-file-name": "netboot.xyz.efi"
      },
      {
        "name": "PXE-UEFI-64-2",
        "test": "substring(option[60].hex,0,20) == 'PXEClient:Arch:00008'",
        "next-server": "185.110.148.227",
        "boot-file-name": "netboot.xyz.efi"
      },
      {
        "name": "PXE-UEFI-64-3",
        "test": "substring(option[60].hex,0,20) == 'PXEClient:Arch:00009'",
        "next-server": "185.110.148.227",
        "boot-file-name": "netboot.xyz.efi"
      },
      {
        "name": "PXE-Legacy",
